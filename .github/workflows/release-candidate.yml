name: Assemble v1.6.0 stable

on:
  workflow_dispatch:
    inputs:
      ubuntu_run_id:
        description: Successful Ubuntu package workflow run ID
        required: true
        type: string
      rhel_run_id:
        description: Successful Rocky package workflow run ID
        required: true
        type: string
      publish_release:
        description: Publish the verified stable bundle after owner approval
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  RELEASE_VERSION: 1.6.0

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and package workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          UBUNTU_RUN_ID: ${{ inputs.ubuntu_run_id }}
          RHEL_RUN_ID: ${{ inputs.rhel_run_id }}
        run: |
          set -euo pipefail
          for run_id in "$UBUNTU_RUN_ID" "$RHEL_RUN_ID"; do
            test "$run_id" != 30676994869
            test "$run_id" != 30676994728
            test "$(gh run view "$run_id" --json conclusion --jq .conclusion)" = success
            run_sha="$(gh run view "$run_id" --json headSha --jq .headSha)"
            git merge-base --is-ancestor "$run_sha" "$GITHUB_SHA"
          done
          test "$(gh run view "$UBUNTU_RUN_ID" --json workflowName --jq .workflowName)" = "Build v1.6.0 stable on Ubuntu"
          test "$(gh run view "$RHEL_RUN_ID" --json workflowName --jq .workflowName)" = "Build v1.6.0 stable on Rocky Linux 9"
      - name: Download verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming/ubuntu incoming/rhel release
          gh run download "${{ inputs.ubuntu_run_id }}" --dir incoming/ubuntu
          gh run download "${{ inputs.rhel_run_id }}" --dir incoming/rhel
          find incoming -type f -name 'nmap-flow-analyzer-1.6.0-*-x64*' ! -name '*.license-inventory.json' -exec cp {} release/ \;
      - name: Create clean source archives
        run: |
          git archive --format=zip --prefix=nmap-flow-analyzer-1.6.0/ \
            -o release/nmap-flow-analyzer-1.6.0-source.zip HEAD
          git archive --format=tar.gz --prefix=nmap-flow-analyzer-1.6.0/ \
            -o release/nmap-flow-analyzer-1.6.0-source.tar.gz HEAD
          unzip -l release/nmap-flow-analyzer-1.6.0-source.zip | grep 'nmap-flow-analyzer-1.6.0/LICENSE'
          tar -tzf release/nmap-flow-analyzer-1.6.0-source.tar.gz | grep 'nmap-flow-analyzer-1.6.0/licenses/DEPENDENCY_LICENSE_INVENTORY.json'
      - name: Create and verify release inventory
        run: |
          mapfile -t artifacts < <(find release -maxdepth 1 -type f -name 'nmap-flow-analyzer-*' -print | sort)
          python scripts/create-checksums.py --version "$RELEASE_VERSION" --output-dir release "${artifacts[@]}"
          test "${#artifacts[@]}" -eq 10
          python scripts/verify-release.py --directory release \
            --manifest release/release-manifest.json --version "$RELEASE_VERSION"
          cp RELEASE_NOTES.md PLATFORM_STATUS.md LICENSE NOTICE COPYRIGHT.md \
            COMMERCIAL_USE.md TRADEMARKS.md THIRD_PARTY_NOTICES.md release/
      - name: Legal finalization reminder
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Legal finalization reminder

          Before considering the Shadow ecosystem fully finalized, obtain
          professional legal review, register applicable copyrights, and pursue
          trademark filings for Shadow Claw™, Shadow Fang™, Shadow Core™, and
          related branding.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: v160-stable-release-${{ github.run_id }}
          path: release/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_release }}
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require an owner-approved branch source
        run: test "${GITHUB_REF_TYPE}" = branch
      - uses: actions/download-artifact@v4
        with:
          name: v160-stable-release-${{ github.run_id }}
          path: release
      - name: Publish approved stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.6.0 release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "nmap-flow-analyzer v1.6.0" \
            --notes-file release/RELEASE_NOTES.md
